<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang Quản Trị Nhà Hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css"> 
  <style>
    body { padding-top: 70px; background-color: #f1f1f1; }
    .page { display: none; }
    .page.active { display: block; }
    .table-responsive { max-height: 600px; }
    .btn-primary { background-color: #0d6efd; border-color: #0d6efd; } 
  </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-danger">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">👨‍💼 Trang Quản Trị</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item"><a class="nav-link" href="#" onclick="showAdminPage('menu')">Quản lý Thực Đơn</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showAdminPage('user')">Quản lý Người Dùng</a></li>
        </ul>
    </div>
  </div>
</nav>

<main class="container mt-4">
  <div id="page-menu" class="page">
    <div class="row">
      <div class="col-lg-4 mb-4">
        <div class="card p-3">
          <h4>Thêm Món Ăn Mới</h4>
          <form id="form-add-menu">
            <div class="mb-3">
              <label for="menu-name" class="form-label">Tên món ăn</label>
              <input type="text" class="form-control" id="menu-name" required>
            </div>
            <div class="mb-3">
              <label for="menu-price" class="form-label">Giá (VND)</label>
              <input type="number" class="form-control" id="menu-price" required>
            </div>
            <div class="mb-3">
              <label for="menu-description" class="form-label">Mô tả</label>
              <textarea class="form-control" id="menu-description" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-danger w-100">Thêm Món</button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <h3>Danh Sách Món Ăn</h3>
        <div class="card p-3 table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Tên Món</th>
                <th>Giá</th>
                <th>Hành Động</th>
              </tr>
            </thead>
            <tbody id="menu-list-body">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="page-user" class="page">
    <h3>Danh Sách Người Dùng (Read / Delete)</h3>
    <div class="card p-3 table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Hành Động</th>
          </tr>
        </thead>
        <tbody id="user-list-body">
          </tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="editMenuModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Chỉnh Sửa Món Ăn</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-edit-menu">
            <input type="hidden" id="edit-menu-id">
            
            <div class="mb-3">
              <label for="edit-menu-name" class="form-label">Tên món ăn</label>
              <input type="text" class="form-control" id="edit-menu-name" required>
            </div>
            <div class="mb-3">
              <label for="edit-menu-price" class="form-label">Giá (VND)</label>
              <input type="number" class="form-control" id="edit-menu-price" required>
            </div>
            <div class="mb-3">
              <label for="edit-menu-description" class="form-label">Mô tả</label>
              <textarea class="form-control" id="edit-menu-description" rows="3"></textarea>
            </div>
            
            <div class="modal-footer border-0">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
              <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
